<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Mera Bhai Amit</title>
    <style>
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(45deg, #0f0c29, #302b63, #24243e);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 45px rgba(0,0,0,0.5);
            animation: fadeIn 1.5s ease-out;
        }

        h1 {
            font-size: 1.8rem;
            line-height: 1.4;
            margin: 0;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }

        .highlight {
            display: block;
            font-size: 2.2rem;
            color: #00d2ff;
            margin: 10px 0;
        }

        .emojis {
            font-size: 1.5rem;
            margin: 15px 0;
            letter-spacing: 5px;
        }

        .btn {
            background: #fff;
            color: #302b63;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1rem;
            margin-top: 25px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Animated Elements */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ffd700;
            top: -10px;
            border-radius: 2px;
            animation: fall 4s linear infinite;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(720deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Happy Birthday</h1>
        <span class="highlight">Mera bhai Amit</span>
        <div class="emojis">🎂🎊🎉🤍😎🥰</div>
        <p style="opacity: 0.8; font-size: 0.9rem;">To the world's best brother!</p>
        <button class="btn" onclick="startParty()">Click for Magic ✨</button>
    </div>

    <script>
        function createConfetti() {
            const colors = ['#00d2ff', '#3a7bd5', '#ff007f', '#ffd700', '#ffffff'];
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDuration = (Math.random() * 2 + 3) + 's';
            confetti.style.opacity = Math.random();
            document.body.appendChild(confetti);

            setTimeout(() => {
                confetti.remove();
            }, 4000);
        }

        function startParty() {
            for(let i = 0; i < 50; i++) {
                setTimeout(createConfetti, i * 50);
            }
        }

        // Auto-start a few confetti for vibe
        setInterval(createConfetti, 700);
    </script>
</body>
</html>
